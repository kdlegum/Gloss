name: Build Android

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.0.12077973"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Verify release version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -nE 's/^version = "([^"]+)"/\1/p' src-tauri/Cargo.toml | head -1)"

          if [ "$package_version" != "$tauri_version" ] || [ "$cargo_version" != "$tauri_version" ]; then
            echo "Version mismatch: package.json=$package_version tauri.conf.json=$tauri_version Cargo.toml=$cargo_version" >&2
            exit 1
          fi

          expected_tag="v$tauri_version"
          if [ "$GITHUB_REF_NAME" != "$expected_tag" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version $tauri_version. Expected $expected_tag." >&2
            exit 1
          fi

      - name: Initialize Android project
        run: npm run tauri -- android init
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Sync Android version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          version_code="$(node -e "const [major, minor, patch] = process.argv[1].split('-')[0].split('.').map(Number); console.log((major * 1000000) + (minor * 1000) + patch)" "$version")"
          cat > src-tauri/gen/android/app/tauri.properties <<EOF
          // THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.
          tauri.android.versionName=$version
          tauri.android.versionCode=$version_code
          EOF

      - name: Download Android pdfium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pdfium src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a
          curl -L https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-android-arm64.tgz \
            | tar -xz -C /tmp/pdfium
          find /tmp/pdfium -name "libpdfium.so" -exec cp {} src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libpdfium.so \;
          test -s src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a/libpdfium.so

      - name: Build installable arm64 APK
        if: github.ref_type != 'tag'
        run: npm run tauri -- android build --debug --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Configure Android release signing
        if: github.ref_type == 'tag'
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 ANDROID_RELEASE_KEYSTORE_PASSWORD ANDROID_RELEASE_KEY_ALIAS ANDROID_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name" >&2
              exit 1
            fi
          done

          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/gloss-release.jks
          cat > src-tauri/gen/android/key.properties <<EOF
          storeFile=gloss-release.jks
          storePassword=$ANDROID_RELEASE_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_RELEASE_KEY_ALIAS
          keyPassword=$ANDROID_RELEASE_KEY_PASSWORD
          EOF

      - name: Build signed release arm64 APK
        if: github.ref_type == 'tag'
        run: npm run tauri -- android build --apk --target aarch64
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          echo "Build tools: $build_tools_dir"

          echo "--- All APKs produced ---"
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" 2>/dev/null || echo "(none found)"

          apk_path="$(find src-tauri/gen/android/app/build/outputs/apk -name "*arm64*.apk" | head -1)"
          if [ -z "$apk_path" ]; then
            apk_path="$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)"
          fi
          echo "Using APK: $apk_path"
          test -n "$apk_path" && test -f "$apk_path"

          ls -lh "$apk_path"
          if [[ "$apk_path" == *unsigned* ]]; then
            echo "Refusing to publish unsigned APK: $apk_path" >&2
            exit 1
          fi
          "$build_tools_dir/apksigner" verify --print-certs "$apk_path"
          "$build_tools_dir/aapt" dump badging "$apk_path" | tee apk-badging.txt
          grep -F "native-code: 'arm64-v8a'" apk-badging.txt

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find src-tauri/gen/android/app/build/outputs/apk -name "*arm64*.apk" | head -1)"
          if [ -z "$apk_path" ]; then
            apk_path="$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)"
          fi
          mkdir -p artifacts
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            cp "$apk_path" artifacts/gloss-android-arm64-release.apk
          else
            cp "$apk_path" artifacts/gloss-android-arm64-debug.apk
          fi

      - name: Upload debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: gloss-android-arm64-debug
          path: artifacts/gloss-android-arm64-debug.apk
          if-no-files-found: error

      - name: Upload release APK artifact
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: gloss-android-arm64-release-${{ github.ref_name }}
          path: artifacts/gloss-android-arm64-release.apk
          if-no-files-found: error

      - name: Upload APK to GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for GitHub Release $GITHUB_REF_NAME to be created by the Windows release job..."
            sleep 20
          done

          gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" artifacts/gloss-android-arm64-release.apk --clobber
