name: Build Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref_type != 'tag'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download pdfium
        shell: bash
        run: |
          mkdir -p /tmp/pdfium
          curl -L https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz \
            | tar -xz -C /tmp/pdfium
          find /tmp/pdfium -name "pdfium.dll" -exec cp {} src-tauri/pdfium.dll \;

      - name: Install frontend deps
        run: npm ci

      - name: Check frontend
        run: npm run check

      - name: Build
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: gloss-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  release:
    if: github.ref_type == 'tag'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Download pdfium
        shell: bash
        run: |
          mkdir -p /tmp/pdfium
          curl -L https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-win-x64.tgz \
            | tar -xz -C /tmp/pdfium
          find /tmp/pdfium -name "pdfium.dll" -exec cp {} src-tauri/pdfium.dll \;

      - name: Install frontend deps
        run: npm ci

      - name: Verify release version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $cargoLockVersion = (Select-String -Path src-tauri/Cargo.lock -Pattern 'name = "gloss"' -Context 0,1).Context.PostContext | Select-String -Pattern 'version = "([^"]+)"' | Select-Object -First 1
          $cargoLockVersion = $cargoLockVersion.Matches.Groups[1].Value

          if ($packageVersion -ne $tauriVersion -or $cargoVersion -ne $tauriVersion) {
            throw "Version mismatch: package.json=$packageVersion tauri.conf.json=$tauriVersion Cargo.toml=$cargoVersion"
          }

          if ($cargoLockVersion -ne $tauriVersion) {
            throw "Cargo.lock version ($cargoLockVersion) does not match app version ($tauriVersion). Run 'cargo build' in src-tauri to update Cargo.lock before tagging."
          }

          $expectedTag = "v$tauriVersion"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match app version $tauriVersion. Expected $expectedTag."
          }

      - name: Check frontend
        run: npm run check

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Gloss ${{ github.ref_name }}
          releaseBody: See the assets to download and install this version of Gloss.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json
